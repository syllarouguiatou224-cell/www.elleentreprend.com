<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Elle Entreprend UJNK 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #DB2777;
            --secondary: #2F3C7E;
            --accent: #FFD700;
            --dark: #1A1A2E;
            --light: #F5F0F5;
            --success: #10B981;
            --danger: #EF4444;
            --text: #333;
            --light-text: #666;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark) 0%, #2D2D44 100%);
            color: var(--text);
            min-height: 100vh;
        }

        /* ========== HEADER ========== */
        header {
            background: rgba(26, 26, 46, 0.95);
            border-bottom: 1px solid rgba(219, 39, 119, 0.2);
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #B95F87;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ========== MAIN CONTAINER ========== */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* ========== STATS SECTION ========== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .stat-label {
            color: var(--light-text);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        /* ========== SEARCH & FILTER ========== */
        .controls {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ========== TABLE ========== */
        .table-container {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        th {
            padding: 1.2rem;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        td {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid #E0E0E0;
        }

        tbody tr {
            transition: background-color 0.3s;
        }

        tbody tr:hover {
            background-color: #F9F9F9;
        }

        .badge {
            display: inline-block;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .badge-etudiante {
            background: #DFF0FD;
            color: #0066CC;
        }

        .badge-diplom {
            background: #D1FAE5;
            color: #065F46;
        }

        .badge-porteuseProjet {
            background: #FEF3C7;
            color: #92400E;
        }

        .action-btn {
            padding: 0.5rem 1rem;
            margin-right: 0.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .action-btn-view {
            background: var(--accent);
            color: var(--dark);
        }

        .action-btn-delete {
            background: var(--danger);
            color: white;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        /* ========== MODAL ========== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .modal-close {
            float: right;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--light-text);
        }

        .modal-close:hover {
            color: var(--dark);
        }

        .modal-title {
            margin-top: 1rem;
            color: var(--primary);
            font-size: 1.3rem;
            margin-bottom: 1rem;
        }

        .modal-info {
            margin-bottom: 1rem;
        }

        .modal-label {
            color: var(--light-text);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .modal-value {
            font-weight: 500;
            color: var(--dark);
            margin-bottom: 1rem;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .stats-grid {
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 1rem;
            }

            .stat-card {
                padding: 1.5rem;
            }

            .stat-value {
                font-size: 1.8rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: 100%;
            }

            table {
                font-size: 0.85rem;
            }

            th, td {
                padding: 0.8rem 0.6rem;
            }

            .action-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.75rem;
                margin-right: 0.3rem;
            }

            .modal-content {
                padding: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .header-container {
                flex-direction: column;
                gap: 1rem;
            }

            .logo {
                font-size: 1.2rem;
            }

            .header-actions {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            table {
                font-size: 0.75rem;
            }

            th, td {
                padding: 0.6rem 0.4rem;
            }
        }

        /* ========== EMPTY STATE ========== */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--light-text);
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="header-container">
            <div class="logo">📊 Admin Dashboard</div>
            <div class="header-actions">
                <button class="btn btn-secondary" onclick="exportCSV()">📥 Exporter CSV</button>
                <button class="btn btn-secondary" onclick="refreshData()">🔄 Actualiser</button>
                <button class="btn btn-secondary" onclick="window.location.href='index.html'">← Retour</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <!-- STATS SECTION -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-label">Total Inscrites</div>
                <div class="stat-value" id="total-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎓</div>
                <div class="stat-label">Étudiantes</div>
                <div class="stat-value" id="etudiante-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💼</div>
                <div class="stat-label">Diplômées</div>
                <div class="stat-value" id="diplom-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🚀</div>
                <div class="stat-label">Porteuses de Projet</div>
                <div class="stat-value" id="projet-count">0</div>
            </div>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Rechercher par nom ou email...">
            </div>
        </div>

        <!-- TABLE -->
        <div class="table-container">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>Prénom</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Catégorie</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="6" class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <p>Aucune inscription pour le moment</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div class="modal-title">Détails d'Inscription</div>
            <div id="modal-body"></div>
            <button class="btn btn-danger" onclick="deleteCurrentRecord()" style="background: var(--danger); color: white; margin-top: 1rem; width: 100%;">Supprimer</button>
        </div>
    </div>

    <script>
        let allData = [];
        let currentRecordId = null;

        // Load data from localStorage
        function loadData() {
            const stored = localStorage.getItem('inscriptions');
            allData = stored ? JSON.parse(stored) : [];
            updateStats();
            displayData();
        }

        // Update statistics
        function updateStats() {
            const total = allData.length;
            const etudiante = allData.filter(d => d.categorie === 'etudiante').length;
            const diplom = allData.filter(d => d.categorie === 'diplom').length;
            const projet = allData.filter(d => d.categorie === 'porteuseProjet').length;

            document.getElementById('total-count').textContent = total;
            document.getElementById('etudiante-count').textContent = etudiante;
            document.getElementById('diplom-count').textContent = diplom;
            document.getElementById('projet-count').textContent = projet;
        }

        // Display data in table
        function displayData() {
            const tableBody = document.getElementById('table-body');
            const searchInput = document.getElementById('search-input').value.toLowerCase();

            let filtered = allData.filter(d => 
                d.prenom.toLowerCase().includes(searchInput) ||
                d.nom.toLowerCase().includes(searchInput) ||
                d.email.toLowerCase().includes(searchInput)
            );

            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="empty-state"><div class="empty-state-icon">🔍</div><p>Aucun résultat</p></td></tr>`;
                return;
            }

            tableBody.innerHTML = filtered.map(record => `
                <tr>
                    <td>${record.prenom}</td>
                    <td>${record.nom}</td>
                    <td>${record.email}</td>
                    <td>${record.telephone}</td>
                    <td><span class="badge badge-${record.categorie}">${getCategoryLabel(record.categorie)}</span></td>
                    <td>
                        <button class="action-btn action-btn-view" onclick="viewRecord(${record.id})">Voir</button>
                        <button class="action-btn action-btn-delete" onclick="deleteRecord(${record.id})">Suppr.</button>
                    </td>
                </tr>
            `).join('');
        }

        function getCategoryLabel(cat) {
            const labels = {
                'etudiante': 'Étudiante',
                'diplom': 'Diplômée',
                'porteuseProjet': 'Porteuse de Projet'
            };
            return labels[cat] || cat;
        }

        // View record details
        function viewRecord(id) {
            const record = allData.find(d => d.id === id);
            if (!record) return;

            currentRecordId = id;
            const modalBody = document.getElementById('modal-body');
            
            modalBody.innerHTML = `
                <div class="modal-info">
                    <div class="modal-label">Prénom</div>
                    <div class="modal-value">${record.prenom}</div>
                </div>
                <div class="modal-info">
                    <div class="modal-label">Nom</div>
                    <div class="modal-value">${record.nom}</div>
                </div>
                <div class="modal-info">
                    <div class="modal-label">Email</div>
                    <div class="modal-value"><a href="mailto:${record.email}">${record.email}</a></div>
                </div>
                <div class="modal-info">
                    <div class="modal-label">Téléphone</div>
                    <div class="modal-value"><a href="tel:${record.telephone}">${record.telephone}</a></div>
                </div>
                <div class="modal-info">
                    <div class="modal-label">Université</div>
                    <div class="modal-value">${record.universite || 'Non spécifié'}</div>
                </div>
                <div class="modal-info">
                    <div class="modal-label">Catégorie</div>
                    <div class="modal-value">${getCategoryLabel(record.categorie)}</div>
                </div>
                <div class="modal-info">
                    <div class="modal-label">Domaine</div>
                    <div class="modal-value">${record.domaine || 'Non spécifié'}</div>
                </div>
                <div class="modal-info">
                    <div class="modal-label">Projet</div>
                    <div class="modal-value">${record.projet || 'Non décrit'}</div>
                </div>
                <div class="modal-info">
                    <div class="modal-label">Intérêts</div>
                    <div class="modal-value">${(record.interessements || []).join(', ') || 'Aucun'}</div>
                </div>
                <div class="modal-info">
                    <div class="modal-label">Date d'Inscription</div>
                    <div class="modal-value">${new Date(record.dateInscription).toLocaleString('fr-FR')}</div>
                </div>
            `;

            document.getElementById('modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
            currentRecordId = null;
        }

        // Delete record
        function deleteRecord(id) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cette inscription?')) {
                allData = allData.filter(d => d.id !== id);
                localStorage.setItem('inscriptions', JSON.stringify(allData));
                updateStats();
                displayData();
            }
        }

        function deleteCurrentRecord() {
            if (currentRecordId) {
                deleteRecord(currentRecordId);
                closeModal();
            }
        }

        // Export CSV
        function exportCSV() {
            if (allData.length === 0) {
                alert('Aucune donnée à exporter');
                return;
            }

            let csv = 'Prénom,Nom,Email,Téléphone,Université,Catégorie,Domaine,Projet,Intérêts,Date\n';
            
            allData.forEach(record => {
                csv += `"${record.prenom}","${record.nom}","${record.email}","${record.telephone}","${record.universite || ''}","${getCategoryLabel(record.categorie)}","${record.domaine || ''}","${record.projet || ''}","${(record.interessements || []).join('; ')}","${new Date(record.dateInscription).toLocaleString('fr-FR')}"\n`;
            });

            const link = document.createElement('a');
            link.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
            link.download = 'inscriptions_elle_entreprend.csv';
            link.click();
        }

        // Search
        document.getElementById('search-input').addEventListener('keyup', displayData);

        // Refresh
        function refreshData() {
            loadData();
            alert('Données actualisées!');
        }

        // Close modal when clicking outside
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });

        // Initial load
        loadData();
    </script>
</body>
</html>
